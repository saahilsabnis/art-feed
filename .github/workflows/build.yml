name: Weekly art feed

on:
  schedule:
    - cron: "41 2 * * 1"   # every Monday at 02:41 UTC
  workflow_dispatch:        # lets you run it any time from the Actions tab or `gh workflow run`

permissions:
  contents: write           # only used to keep the schedule from going idle (last step)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - id: pages
        uses: actions/configure-pages@v5

      - name: Pick and resize this week's paintings
        run: python build_feed.py --config sources.json --out site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # repository activity. A tiny commit about once a month keeps it running.
      - name: Keep the weekly schedule active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 24 * 3600 )) ]; then
            date -u +%F > .github/last-build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-build
            git commit -m "Keep the weekly art build active"
            git push
          fi
